project:
  name: "taxi-duration-predictor"
  version: "0.1.0"

data:
  raw_path: "data/raw"
  processed_path: "data/processed"

model:
  artifact_dir: "models/artifacts"
  artifact_name: "taxi_duration.pkl"

features:
  categorical:
    - "PU_DO"
  numerical:
    - "trip_distance"

training:
  test_size: 0.2
  random_state: 42
  
api:
  host: "0.0.0.0"
  port: 8000