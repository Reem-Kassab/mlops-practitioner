services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    image: prodml-api:0.1.0

    ports:
      - "${PORT:-8000}:8000"

    environment:
      MODEL_VERSION: "${MODEL_VERSION:-v0.1.0}"
      MODEL_TRAINING_DATE: "${MODEL_TRAINING_DATE:-unknown}"

    volumes:
      - ../models:/app/models:ro

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3